# Atlas - atlas 项目管理工具
id: atlas
name: Atlas
version: 0.1.0
category: dev-workflow
# 外部子应用路径用绝对路径
path: /Users/me/atlas
status: disabled

ui:
  mode: webview
  url: http://127.0.0.1:51130
  icon: /Users/me/atlas/assets/icon.png

process:
  start: "python3 /Users/me/atlas/bin/atlas web"
  stop: SIGTERM
  autostart: false
  working_dir: /Users/me/atlas
  log_file: /Users/me/atlas/logs/atlas.log
