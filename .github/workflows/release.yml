name: 发布 aIdea

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: shell-frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix shell-frontend

      - name: 校验 tag 与四处应用版本一致
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tauri_version="$(python3 -c 'import json; print(json.load(open("shell-native/tauri.conf.json"))["version"])')"
          cargo_version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' shell-native/Cargo.toml | head -1)"
          frontend_version="$(python3 -c 'import json; print(json.load(open("shell-frontend/package.json"))["version"])')"
          lock_version="$(python3 -c 'import json; lock=json.load(open("shell-frontend/package-lock.json")); print(lock["version"] if lock["version"] == lock["packages"][""]["version"] else "")')"
          test "$tag_version" = "$tauri_version" && test "$tag_version" = "$cargo_version" && test "$tag_version" = "$frontend_version" && test "$tag_version" = "$lock_version" || {
            echo "tag 版本 $tag_version 与版本文件不一致：tauri=$tauri_version cargo=$cargo_version frontend=$frontend_version lock=$lock_version"
            exit 1
          }

      - name: 构建 macOS Apple Silicon 应用
        working-directory: shell-native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "缺少 TAURI_SIGNING_PRIVATE_KEY，拒绝发布不可验证的更新包。"
            exit 1
          }
          ../shell-frontend/node_modules/.bin/tauri build --bundles app,dmg

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            shell-native/target/release/bundle/dmg/*.dmg
            shell-native/target/release/bundle/macos/*.tar.gz
            shell-native/target/release/bundle/macos/*.tar.gz.sig

      - name: 生成并上传 updater 清单
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact="$(find shell-native/target/release/bundle/macos -name '*.tar.gz' -type f | head -1)"
          test -n "$artifact" && test -f "$artifact.sig" || {
            echo "未找到签名 updater 产物。"
            exit 1
          }
          export VERSION="${TAG#v}"
          export URL="https://github.com/$REPOSITORY/releases/download/$TAG/$(basename "$artifact")"
          export SIGNATURE="$(cat "$artifact.sig")"
          node -e 'console.log(JSON.stringify({version: process.env.VERSION, notes: `Release ${process.env.TAG}`, pub_date: new Date().toISOString(), platforms: {"darwin-aarch64": {url: process.env.URL, signature: process.env.SIGNATURE}}}, null, 2))' > latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$REPOSITORY"
